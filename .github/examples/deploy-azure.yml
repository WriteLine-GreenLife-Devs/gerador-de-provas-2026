# Exemplo de workflow de integração contínua e deploy para o Azure.
# Este arquivo não é executado enquanto permanecer fora de .github/workflows.

name: Build, test and deploy ASP.NET Core app to Azure

on:
  workflow_dispatch:

  # Habilite este gatilho somente depois de validar a execução manual:
  # push:
  #   branches:
  #     - main

env:
  DOTNET_VERSION: "10.x"
  WEBAPP_PROJECT: src/GeradorDeProvas.WebApp/GeradorDeProvas.WebApp.csproj
  INFRA_PROJECT: src/GeradorDeProvas.Infra/GeradorDeProvas.Infra.csproj
  UNIT_TEST_PROJECT: tests/GeradorDeProvas.Testes.Unidade/GeradorDeProvas.Testes.Unidade.csproj
  INTEGRATION_TEST_PROJECT: tests/GeradorDeProvas.Testes.Integracao/GeradorDeProvas.Testes.Integracao.csproj
  E2E_TEST_PROJECT: tests/GeradorDeProvas.Testes.E2E/GeradorDeProvas.Testes.E2E.csproj
  PUBLISH_PATH: ${{ runner.temp }}/publish

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Install Playwright Chromium
        shell: pwsh
        run: tests/GeradorDeProvas.Testes.E2E/bin/Release/net10.0/playwright.ps1 install chromium

      - name: Run unit tests
        run: dotnet test ${{ env.UNIT_TEST_PROJECT }} --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test ${{ env.INTEGRATION_TEST_PROJECT }} --configuration Release --no-build

      - name: Run E2E tests
        run: >-
          dotnet test ${{ env.E2E_TEST_PROJECT }}
          --configuration Release
          --no-build
          --settings tests/GeradorDeProvas.Testes.E2E/playwright.runsettings

      - name: Publish application
        run: >-
          dotnet publish ${{ env.WEBAPP_PROJECT }}
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_PATH }}"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  migrate:
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.WEBAPP_PROJECT }}

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply Entity Framework migrations
        env:
          AZURESQL_CONNECTION_STRING: ${{ secrets.AZURESQL_CONNECTION_STRING }}
          Infra__NewRelic__LicenseKey: ${{ secrets.NEWRELIC_LICENSE_KEY }}
          Apresentacao__AutoMapper__LicenseKey: ${{ secrets.AUTOMAPPER_LICENSE_KEY }}
        run: >-
          dotnet ef database update
          --project ${{ env.INFRA_PROJECT }}
          --startup-project ${{ env.WEBAPP_PROJECT }}
          --configuration Release
          --connection "$env:AZURESQL_CONNECTION_STRING"

  deploy:
    runs-on: windows-latest
    needs:
      - build-and-test
      - migrate
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: app

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Web App settings
        shell: pwsh
        run: |
          az webapp config appsettings set `
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" `
            --name "${{ vars.AZURE_WEBAPP_NAME }}" `
            --settings `
              "ConnectionStrings__SqlServerEF=${{ secrets.AZURESQL_CONNECTION_STRING }}" `
              "Infra__NewRelic__LicenseKey=${{ secrets.NEWRELIC_LICENSE_KEY }}" `
              "Apresentacao__AutoMapper__LicenseKey=${{ secrets.AUTOMAPPER_LICENSE_KEY }}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: app
